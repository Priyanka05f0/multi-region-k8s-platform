commands:
  deploy:
    description: "Deploys multi-region EKS infrastructure using Terraform"
    script: |
      echo "Starting multi-region deployment..."

      cd terraform/environments/us-east-1
      terraform init
      terraform apply -auto-approve

      cd ../eu-west-1
      terraform init
      terraform apply -auto-approve

      cd ../ap-south-1
      terraform init
      terraform apply -auto-approve

      echo "Deployment completed successfully."

  verify:
    description: "Verifies that EKS clusters are created in all regions"
    script: |
      echo "Verifying EKS clusters..."

      aws eks list-clusters --region us-east-1
      aws eks list-clusters --region eu-west-1
      aws eks list-clusters --region ap-south-1

      echo "Verification completed."
