apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-ap-south-1
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Priyanka05f0/multi-region-k8s-platform
    targetRevision: main
    path: gitops/apps/sample-app

  destination:
    name: ap-south-1
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
